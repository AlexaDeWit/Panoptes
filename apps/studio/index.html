<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Saerskriven: Open-source threat modelling studio</title>
    <base href="%BASE_URL%" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Draw data-flow diagrams, record threats on the diagram, and open or save Threat Dragon JSON and Saerskriven YAML in your browser."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles.css" />

      <style>
        .initial-page {
          display: none;
        }
      </style>

    <div id="root">
      <div class="initial-page" role="status">
        <span class="initial-page__indicator" aria-hidden="true"></span>

        <p class="no-script">
          Enable JavaScript to use the interactive studio.
        </p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
