<svg xmlns="http://www.w3.org/2000/svg" viewBox="-98 2 1798 1236" width="1798" height="1236"><title>High Level</title><style>.pn-element {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
.pn-shape {
  fill: #FAF8F5;
  stroke: #3E3A35;
  stroke-width: 2;
}
.pn-actor {
  fill: #EAEFF6;
}
.pn-process {
  fill: #EFF3E8;
}
.pn-store {
  fill: none;
  stroke-width: 2.5;
}
.pn-boundary-box,
.pn-boundary-curve {
  fill: none;
  stroke: #706B62;
  stroke-width: 2;
  stroke-dasharray: 8 6;
}
.pn-out-of-scope {
  opacity: 0.5;
}
.pn-out-of-scope .pn-shape {
  stroke-dasharray: 6 4;
}
.pn-label {
  fill: #3E3A35;
  font-size: 12px;
  font-weight: 500;
  text-anchor: middle;
  dominant-baseline: central;
}
.pn-note {
  fill: #706B62;
  font-size: 12px;
  text-anchor: middle;
  dominant-baseline: central;
}
.pn-flow {
  fill: none;
}
.pn-flow-arrow {
  fill: #3E3A35;
  stroke: none;
}
.pn-flow-label {
  fill: #706B62;
  font-size: 11px;
  text-anchor: middle;
  dominant-baseline: central;
  paint-order: stroke;
  stroke: #F4EFE6;
  stroke-width: 3;
  stroke-linejoin: round;
}
.pn-badge {
  stroke: #FDFBF7;
  stroke-width: 3;
}
.pn-badge-count {
  fill: #FDFBF7;
  stroke: none;
  font-weight: 600;
  text-anchor: middle;
  dominant-baseline: central;
}
.pn-badge-primary .pn-badge-count {
  font-size: 11px;
}
.pn-badge-secondary .pn-badge-count {
  font-size: 9px;
}
.pn-badge-mark {
  fill: #FDFBF7;
  stroke: none;
  font-size: 9px;
  font-weight: 700;
  text-anchor: middle;
  dominant-baseline: central;
}
.pn-tone-critical {
  fill: #BA2D0B;
}
.pn-tone-high {
  fill: #A45611;
}
.pn-tone-medium {
  fill: #3A6EA5;
}
.pn-tone-low {
  fill: #4A5D23;
}
.pn-tone-neutral {
  fill: #757069;
}
