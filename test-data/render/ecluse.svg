<svg xmlns="http://www.w3.org/2000/svg" viewBox="-98 2 1798 1236" width="1798" height="1236"><title>High Level</title><style>.pn-element {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
.pn-shape {
  fill: #ffffff;
  stroke: #1f2937;
  stroke-width: 1.5;
}
.pn-actor {
  fill: #eef2ff;
}
.pn-process {
  fill: #f0fdf4;
}
.pn-store {
  fill: none;
  stroke-width: 2;
}
.pn-boundary-box,
.pn-boundary-curve {
  fill: none;
  stroke: #6b7280;
  stroke-width: 2;
  stroke-dasharray: 8 6;
}
.pn-out-of-scope {
  opacity: 0.5;
}
.pn-out-of-scope .pn-shape {
  stroke-dasharray: 6 4;
}
.pn-label {
  fill: #111827;
  font-size: 12px;
  font-weight: 500;
  text-anchor: middle;
  dominant-baseline: central;
}
.pn-note {
  fill: #374151;
  font-size: 12px;
  text-anchor: middle;
  dominant-baseline: central;
}
.pn-flow {
  fill: none;
}
.pn-flow-arrow {
  fill: #1f2937;
  stroke: none;
}
.pn-flow-label {
  fill: #374151;
  font-size: 11px;
  text-anchor: middle;
  dominant-baseline: central;
  paint-order: stroke;
  stroke: #ffffff;
  stroke-width: 3;
  stroke-linejoin: round;
}
.pn-badge {
  stroke: #ffffff;
  stroke-width: 1.5;
}
.pn-badge-count {
  fill: #ffffff;
  stroke: none;
  font-weight: 600;
  text-anchor: middle;
  dominant-baseline: central;
}
.pn-badge-primary .pn-badge-count {
  font-size: 11px;
}
.pn-badge-secondary .pn-badge-count {
  font-size: 9px;
}
.pn-tone-critical {
  fill: #7f1d1d;
}
.pn-tone-high {
  fill: #b91c1c;
}
.pn-tone-medium {
  fill: #b45309;
}
.pn-tone-low {
  fill: #1d4ed8;
}
.pn-tone-neutral {
  fill: #52525b;
}
