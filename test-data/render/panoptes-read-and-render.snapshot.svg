<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 1916 676" width="1916" height="676"><title>Reading a file and rendering it</title><style>.pn-element {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
.pn-shape {
  fill: #ffffff;
  stroke: #1f2937;
  stroke-width: 1.5;
}
.pn-actor {
  fill: #eef2ff;
}
.pn-process {
  fill: #f0fdf4;
}
.pn-store {
  fill: none;
  stroke-width: 2;
}
.pn-boundary-box,
.pn-boundary-curve {
  fill: none;
  stroke: #6b7280;
  stroke-width: 2;
  stroke-dasharray: 8 6;
}
.pn-out-of-scope {
  opacity: 0.5;
}
.pn-out-of-scope .pn-shape {
  stroke-dasharray: 6 4;
}
.pn-label {
  fill: #111827;
  font-size: 12px;
  font-weight: 500;
  text-anchor: middle;
  dominant-baseline: central;
}
.pn-note {
  fill: #374151;
  font-size: 12px;
  text-anchor: middle;
  dominant-baseline: central;
}
.pn-flow {
  fill: none;
}
.pn-flow-arrow {
  fill: #1f2937;
  stroke: none;
}
.pn-flow-label {
  fill: #374151;
  font-size: 11px;
  text-anchor: middle;
  dominant-baseline: central;
  paint-order: stroke;
  stroke: #ffffff;
  stroke-width: 3;
  stroke-linejoin: round;
}
.pn-badge {
  stroke: #ffffff;
  stroke-width: 1.5;
}
.pn-badge-count {
  fill: #ffffff;
  stroke: none;
  font-weight: 600;
  text-anchor: middle;
  dominant-baseline: central;
}
.pn-badge-primary .pn-badge-count {
  font-size: 11px;
}
.pn-badge-secondary .pn-badge-count {
  font-size: 9px;
}
.pn-badge-mark {
  fill: #ffffff;
  stroke: none;
  font-size: 9px;
  font-weight: 700;
  text-anchor: middle;
  dominant-baseline: central;
}
.pn-tone-critical {
  fill: #7f1d1d;
}
.pn-tone-high {
  fill: #b91c1c;
}
.pn-tone-medium {
  fill: #b45309;
}
.pn-tone-low {
  fill: #1d4ed8;
}
.pn-tone-neutral {
  fill: #52525b;
}
</style><g transform="translate(0, 60)"><g class="pn-element"><rect class="pn-shape pn-boundary-box" width="260" height="360"></rect><text class="pn-label" x="130" y="12"><tspan x="130" dy="0">Foreign input</tspan></text></g></g><g transform="translate(500, 0)"><g class="pn-element"><rect class="pn-shape pn-boundary-box" width="760" height="660"></rect><text class="pn-label" x="380" y="12"><tspan x="380" dy="0">Panoptes process</tspan></text></g></g><g transform="translate(40, 100)"><g class="pn-element"><rect class="pn-shape pn-actor" width="200" height="70"></rect><text class="pn-label" x="100" y="27.5"><tspan x="100" dy="0">Model author or upstream</tspan><tspan x="100" dy="15">tool</tspan></text></g></g><g transform="translate(40, 300)"><g class="pn-element"><line class="pn-shape pn-store" x1="0" y1="0" x2="200" y2="0"></line><line class="pn-shape pn-store" x1="0" y1="80" x2="200" y2="80"></line><text class="pn-label" x="100" y="40"><tspan x="100" dy="0">Threat model file</tspan></text></g></g><g transform="translate(540, 270)"><g class="pn-element"><circle class="pn-shape pn-process" cx="70" cy="70" r="70"></circle><text class="pn-label" x="70" y="70"><tspan x="70" dy="0">Codec read</tspan></text></g></g><g transform="translate(780, 300)"><g class="pn-element"><line class="pn-shape pn-store" x1="0" y1="0" x2="200" y2="0"></line><line class="pn-shape pn-store" x1="0" y1="80" x2="200" y2="80"></line><text class="pn-label" x="100" y="40"><tspan x="100" dy="0">Internal model</tspan></text></g></g><g transform="translate(1080, 60)"><g class="pn-element"><circle class="pn-shape pn-process" cx="70" cy="70" r="70"></circle><text class="pn-label" x="70" y="62.5"><tspan x="70" dy="0">Markdown</tspan><tspan x="70" dy="15">register</tspan></text><g class="pn-badge" transform="translate(140, 0)"><g class="pn-badge-primary"><circle class="pn-tone-medium" r="13"></circle><text class="pn-badge-count" y="-3">2</text><text class="pn-badge-mark" y="6">M</text></g></g></g></g><g transform="translate(1080, 270)"><g class="pn-element"><circle class="pn-shape pn-process" cx="70" cy="70" r="70"></circle><text class="pn-label" x="70" y="62.5"><tspan x="70" dy="0">Canvas glyphs</tspan><tspan x="70" dy="15">and SVG</tspan></text><g class="pn-badge" transform="translate(140, 0)"><g class="pn-badge-primary"><circle class="pn-tone-medium" r="13"></circle><text class="pn-badge-count" y="-3">2</text><text class="pn-badge-mark" y="6">M</text></g></g></g></g><g transform="translate(1080, 480)"><g class="pn-element"><circle class="pn-shape pn-process" cx="70" cy="70" r="70"></circle><text class="pn-label" x="70" y="70"><tspan x="70" dy="0">Codec write</tspan></text></g></g><g transform="translate(1440, 300)"><g class="pn-element"><line class="pn-shape pn-store" x1="0" y1="0" x2="220" y2="0"></line><line class="pn-shape pn-store" x1="0" y1="80" x2="220" y2="80"></line><text class="pn-label" x="110" y="40"><tspan x="110" dy="0">Rendered and saved files</tspan></text></g></g><g transform="translate(1760, 270)"><g class="pn-element pn-out-of-scope"><circle class="pn-shape pn-process" cx="70" cy="70" r="70"></circle><text class="pn-label" x="70" y="55"><tspan x="70" dy="0">Downstream</tspan><tspan x="70" dy="15">site</tspan><tspan x="70" dy="15">generator</tspan></text></g></g><g transform="translate(540, 470)"><g class="pn-element"><text class="pn-note" x="130" y="42.5"><tspan x="130" dy="0">Every read is bounded before anything</tspan><tspan x="130" dy="15">trusts it. 4 MiB of text, 64 levels</tspan><tspan x="130" dy="15">of nesting, 50 aliases, and 100,000</tspan><tspan x="130" dy="15">nodes those aliases may reach.</tspan></text></g></g><g class="pn-element"><path class="pn-shape pn-flow" d="M 140 170 L 140 300"></path><path class="pn-flow-arrow" d="M 140 300 L 135 288 L 145 288 Z"></path><text class="pn-flow-label" x="199.375" y="235"><tspan x="199.375" dy="0">Writes the file</tspan></text></g><g class="pn-element"><path class="pn-shape pn-flow" d="M 240 340 L 540 340"></path><path class="pn-flow-arrow" d="M 540 340 L 528 345 L 528 335 Z"></path><text class="pn-flow-label" x="390" y="359.5"><tspan x="390" dy="0">A text of unknown</tspan><tspan x="390" dy="13.75">format</tspan></text></g><g class="pn-element"><path class="pn-shape pn-flow" d="M 680 340 L 780 340"></path><path class="pn-flow-arrow" d="M 780 340 L 768 345 L 768 335 Z"></path><text class="pn-flow-label" x="730" y="359.5"><tspan x="730" dy="0">Mapped records</tspan><tspan x="730" dy="13.75">and divergences</tspan></text></g><g class="pn-element"><path class="pn-shape pn-flow" d="M 980 340 L 1030 130 L 1080 130"></path><path class="pn-flow-arrow" d="M 1080 130 L 1068 135 L 1068 125 Z"></path><text class="pn-flow-label" x="955.789" y="223.283"><tspan x="955.789" dy="0">Threat prose</tspan></text></g><g class="pn-element"><path class="pn-shape pn-flow" d="M 980 340 L 1080 340"></path><path class="pn-flow-arrow" d="M 1080 340 L 1068 345 L 1068 335 Z"></path><text class="pn-flow-label" x="1030" y="359.5"><tspan x="1030" dy="0">Elements</tspan><tspan x="1030" dy="13.75">and geometry</tspan></text></g><g class="pn-element"><path class="pn-shape pn-flow" d="M 980 340 L 1030 550 L 1080 550"></path><path class="pn-flow-arrow" d="M 1080 550 L 1068 555 L 1068 545 Z"></path><text class="pn-flow-label" x="1031.309" y="438.736"><tspan x="1031.309" dy="0">Save</tspan></text></g><g class="pn-element"><path class="pn-shape pn-flow" d="M 1220 130 L 1550 180 L 1550 300"></path><path class="pn-flow-arrow" d="M 1550 300 L 1545 288 L 1555 288 Z"></path><text class="pn-flow-label" x="1380.934" y="181.835"><tspan x="1380.934" dy="0">Register markdown</tspan></text></g><g class="pn-element"><path class="pn-shape pn-flow" d="M 1220 340 L 1440 340"></path><path class="pn-flow-arrow" d="M 1440 340 L 1428 345 L 1428 335 Z"></path><text class="pn-flow-label" x="1330" y="359.5"><tspan x="1330" dy="0">Diagram SVG</tspan></text></g><g class="pn-element"><path class="pn-shape pn-flow" d="M 1220 550 L 1550 500 L 1550 380"></path><path class="pn-flow-arrow" d="M 1550 380 L 1555 392 L 1545 392 Z"></path><text class="pn-flow-label" x="1388.998" y="551.387"><tspan x="1388.998" dy="0">Saved model file</tspan></text></g><g class="pn-element"><path class="pn-shape pn-flow" d="M 1660 340 L 1760 340"></path><path class="pn-flow-arrow" d="M 1760 340 L 1748 345 L 1748 335 Z"></path><text class="pn-flow-label" x="1710" y="387.5"><tspan x="1710" dy="0">Published register</tspan></text></g></svg>
