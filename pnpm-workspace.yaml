# Single version policy: the catalog below is the only place an external
# dependency version is written. Leaf manifests use "catalog:" references, and
# internal dependencies use "workspace:*".
packages:
  - 'packages/*'
  - 'apps/*'

# Postinstall scripts are opt-in per package. Only these run, and each does so
# to install its native binary. Every other package's build scripts stay off.
# esbuild stays off: its platform binary arrives as an optional dependency, so
# the script is redundant.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  nx: true
  unrs-resolver: true
  esbuild: false

catalog:
  '@babel/core': ^7.14.5
  '@babel/preset-react': ^7.14.5
  '@nx/esbuild': 23.1.2
  '@nx/js': 23.1.2
  '@nx/node': 23.1.2
  '@nx/react': 23.1.2
  '@nx/vite': 23.1.2
  '@nx/vitest': 23.1.2
  '@nx/web': 23.1.2
  '@swc-node/register': 1.11.1
  '@swc/core': 1.15.8
  '@swc/helpers': 0.5.18
  '@testing-library/dom': 10.4.0
  '@testing-library/react': 16.3.0
  '@types/node': ^24.0.0
  '@types/react': ^19.0.0
  '@types/react-dom': ^19.0.0
  '@vitejs/plugin-react': ^6.0.0
  '@vitest/coverage-v8': ~4.1.0
  '@vitest/ui': ~4.1.0
  esbuild: ^0.27.0
  jiti: 2.4.2
  jsdom: ^27.1.0
  nx: 23.1.2
  prettier: ^3.8.1
  react: ^19.0.0
  react-dom: ^19.0.0
  tslib: ^2.3.0
  # TypeScript stays on 6.x: nx's @nx/js/typescript plugin drives the compiler
  # through the programmatic API, which the Go-native 7.0 line does not ship
  # until 7.1 (`ts.readConfigFile is not a function` under 7.0.2). Type-aware
  # lint speed comes from oxlint's tsgolint, which carries its own Go checker.
  # Revisit at 7.1.
  typescript: ~6.0.3
  vite: ^8.0.0
  vitest: ~4.1.0
