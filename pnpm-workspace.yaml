packages:
  - 'packages/*'
  - 'apps/*'

# Postinstall scripts are opt-in per package. Only these run, and each does so
# to install its native binary. Every other package's build scripts stay off.
# esbuild stays off: its platform binary arrives as an optional dependency, so
# the script is redundant.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  nx: true
  unrs-resolver: true
  esbuild: false

# Seven days, in minutes. A freshly published version does not resolve until
# it has aged, so a poisoned release is likely caught and pulled first.
minimumReleaseAge: 10080

# Exact pins that predate the delay and are not yet seven days old. Scoped to
# these versions only (pnpm rejects name patterns with versions), so each
# entry is a no-op once its version ages out.
minimumReleaseAgeExclude:
  - 'nx@23.1.2'
  - '@nx/devkit@23.1.2'
  - '@nx/docker@23.1.2'
  - '@nx/esbuild@23.1.2'
  - '@nx/eslint@23.1.2'
  - '@nx/eslint-plugin@23.1.2'
  - '@nx/jest@23.1.2'
  - '@nx/js@23.1.2'
  - '@nx/node@23.1.2'
  - '@nx/nx-darwin-arm64@23.1.2'
  - '@nx/nx-darwin-x64@23.1.2'
  - '@nx/nx-freebsd-x64@23.1.2'
  - '@nx/nx-linux-arm-gnueabihf@23.1.2'
  - '@nx/nx-linux-arm64-gnu@23.1.2'
  - '@nx/nx-linux-arm64-musl@23.1.2'
  - '@nx/nx-linux-x64-gnu@23.1.2'
  - '@nx/nx-linux-x64-musl@23.1.2'
  - '@nx/nx-win32-arm64-msvc@23.1.2'
  - '@nx/nx-win32-x64-msvc@23.1.2'
  - '@nx/playwright@23.1.2'
  - '@nx/react@23.1.2'
  - '@nx/vite@23.1.2'
  - '@nx/vitest@23.1.2'
  - '@nx/web@23.1.2'
  - '@nx/workspace@23.1.2'
  - '@testing-library/react@16.3.3'
  # oxlint 1.80.0 was published 2026-08-24, inside the window when adopted.
  - 'oxlint@1.80.0'
  - '@oxlint/binding-android-arm-eabi@1.80.0'
  - '@oxlint/binding-android-arm64@1.80.0'
  - '@oxlint/binding-darwin-arm64@1.80.0'
  - '@oxlint/binding-darwin-x64@1.80.0'
  - '@oxlint/binding-freebsd-x64@1.80.0'
  - '@oxlint/binding-linux-arm-gnueabihf@1.80.0'
  - '@oxlint/binding-linux-arm-musleabihf@1.80.0'
  - '@oxlint/binding-linux-arm64-gnu@1.80.0'
  - '@oxlint/binding-linux-arm64-musl@1.80.0'
  - '@oxlint/binding-linux-ppc64-gnu@1.80.0'
  - '@oxlint/binding-linux-riscv64-gnu@1.80.0'
  - '@oxlint/binding-linux-riscv64-musl@1.80.0'
  - '@oxlint/binding-linux-s390x-gnu@1.80.0'
  - '@oxlint/binding-linux-x64-gnu@1.80.0'
  - '@oxlint/binding-linux-x64-musl@1.80.0'
  - '@oxlint/binding-openharmony-arm64@1.80.0'
  - '@oxlint/binding-win32-arm64-msvc@1.80.0'
  - '@oxlint/binding-win32-ia32-msvc@1.80.0'
  - '@oxlint/binding-win32-x64-msvc@1.80.0'

catalog:
  '@babel/core': ^8.0.0
  '@babel/preset-react': ^8.0.0
  '@nx/esbuild': 23.1.2
  '@nx/eslint-plugin': 23.1.2
  '@nx/js': 23.1.2
  '@nx/node': 23.1.2
  '@nx/playwright': 23.1.2
  '@nx/react': 23.1.2
  '@nx/vite': 23.1.2
  '@nx/vitest': 23.1.2
  '@nx/web': 23.1.2
  # Pinned exactly to the nixpkgs playwright-driver version: the browsers come
  # from the flake, and a driver of one version cannot run browsers installed
  # for another. The version-equality test in apps/studio-e2e reds a mismatch,
  # and Renovate holds playwright bumps for Dependency Dashboard approval so
  # the pair moves together (renovate.json5).
  '@playwright/test': 1.59.1
  '@swc-node/register': 1.12.1
  '@swc/core': 1.16.1
  '@swc/helpers': 0.5.23
  '@testing-library/dom': 10.4.1
  '@testing-library/react': 16.3.3
  '@types/node': ^24.0.0
  '@types/react': ^19.0.0
  '@types/react-dom': ^19.0.0
  # Parser only, for the boundaries host: no type program and no checker
  # API, the rule reads syntax alone. The parser still depends on the
  # typescript package (typescript-estree consumes the compiler's parser)
  # and 8.x declares a ceiling of typescript <6.1.0, so bump it in the
  # same Renovate wave as the typescript pin when TS 7.1 lands (#57).
  '@typescript-eslint/parser': ^8.0.0
  '@vitejs/plugin-react': ^6.0.0
  '@vitest/coverage-v8': ~4.1.0
  '@vitest/ui': ~4.1.0
  # Threat Dragon validates a threat model with ajv against the JSON Schema
  # vendored under test-data, so the write codec's oracle runs the validator
  # that tool runs.
  ajv: ^8.17.1
  effect: ^3.22.0
  esbuild: ^0.28.0
  eslint: ^10.0.0
  # Declared here rather than reached through effect, which depends on it:
  # the version the property tests run against is ours to pin. ^3.23.2 is
  # what effect resolves, so the lockfile keeps one copy.
  fast-check: ^3.23.2
  jiti: 2.7.0
  jsdom: ^27.1.0
  nx: 23.1.2
  # Pinned exactly: a pre-1.0 oxfmt bump may reformat the tree, so it happens
  # only in a reviewed PR. Renovate proposes the bumps.
  oxfmt: 0.64.0
  # Pinned exactly: oxlint minors add rules, so a range bump could redden CI
  # outside a reviewed PR. Renovate proposes the bumps.
  oxlint: 1.80.0
  # tsgolint bundles its own typescript-go checker, so it does not care about
  # the catalog's typescript version.
  oxlint-tsgolint: 7.0.2001
  react: ^19.0.0
  react-dom: ^19.0.0
  tslib: ^2.3.0
  # TypeScript stays on 6.x: nx's @nx/js/typescript plugin drives the compiler
  # through the programmatic API, which the Go-native 7.0 line does not ship
  # until 7.1 (`ts.readConfigFile is not a function` under 7.0.2). Type-aware
  # lint speed comes from oxlint's tsgolint, which carries its own Go checker.
  # Revisit at 7.1.
  typescript: ~6.0.3
  vite: ^8.0.0
  vitest: ~4.1.0
  yaml: ^2.9.0
  # Floor below the 4.5 line: it was younger than minimumReleaseAge when
  # adopted (2026-08-29), so the caret resolves to the newest aged release
  # and picks up 4.5.x as it ages.
  zod: ^4.4.0
