<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1948 708"><style>.pn-element {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
.pn-shape {
  fill: #FAF8F2;
  stroke: #38342E;
  stroke-width: 2;
}
.pn-actor {
  fill: #EAE5DA;
}
.pn-process {
  fill: #E7E9E1;
}
.pn-store {
  fill: none;
  stroke-width: 2.5;
}
.pn-boundary-box,
.pn-boundary-curve {
  fill: none;
  stroke: #6B655C;
  stroke-width: 2;
  stroke-dasharray: 8 6;
}
.pn-out-of-scope {
  opacity: 0.5;
}
.pn-out-of-scope .pn-shape {
  stroke-dasharray: 6 4;
}
.pn-label {
  fill: #38342E;
  font-size: 10px;
  font-weight: 500;
  text-anchor: middle;
  dominant-baseline: central;
}
.pn-note {
  fill: #6B655C;
  font-size: 12px;
  text-anchor: middle;
  dominant-baseline: central;
}
.pn-flow {
  fill: none;
}
.pn-flow-arrow {
  fill: #38342E;
  stroke: none;
}
.pn-flow-label {
  fill: #6B655C;
  font-size: 10px;
  text-anchor: middle;
  dominant-baseline: central;
  paint-order: stroke;
  stroke: #F9F6F0;
  stroke-width: 3;
  stroke-linejoin: round;
}
.pn-badge {
  stroke: #FAF8F2;
  stroke-width: 3;
}
.pn-badge-count {
  fill: #FAF8F2;
  stroke: none;
  font-weight: 600;
  text-anchor: middle;
  dominant-baseline: central;
}
.pn-badge-primary .pn-badge-count {
  font-size: 11px;
}
.pn-badge-secondary .pn-badge-count {
  font-size: 9px;
}
.pn-badge-mark {
  fill: #FAF8F2;
  stroke: none;
  font-size: 9px;
  font-weight: 700;
  text-anchor: middle;
  dominant-baseline: central;
}
.pn-tone-critical {
  fill: #C14339;
}
.pn-tone-high {
  fill: #A85E1D;
}
.pn-tone-medium {
  fill: #46788A;
}
.pn-tone-low {
  fill: #4B6B50;
}
.pn-tone-neutral {
  fill: #756E63;
}
