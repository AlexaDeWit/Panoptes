name: Deploy studio to GitHub Pages

# Tag CI explicitly dispatches promotion after publishing its release.
on:
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Verify the latest release website
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Checkout the promotion controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve Latest and verify its archive
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/release/pages.sh resolve
      # Re-upload the verified tar without extracting or rebuilding its contents.
      - name: Stage the Pages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: release-site/artifact.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy the latest release
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout the promotion controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recheck Latest after any environment wait
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_TAG: ${{ needs.prepare.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: bash scripts/release/pages.sh check
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - name: Check the version served to a fresh request
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_TAG: ${{ needs.prepare.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/release/pages.sh verify-live
