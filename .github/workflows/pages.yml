name: Deploy studio to GitHub Pages

# Scheduled workflows run from the default branch. A dispatch can target any
# ref in GitHub's UI, so the job below also refuses every ref except main.
on:
  schedule:
    # 05:17 UTC is after midnight in Toronto year-round. Avoiding the top of
    # the hour also reduces the delays GitHub documents for busy schedules.
    - cron: '17 5 * * *'
  workflow_dispatch:

# A manual first release and the nightly release may meet. Queue them rather
# than cancelling a deployment after it has begun.
concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Keep installs on the same restored pnpm-store path as the CI workflow.
  npm_config_store_dir: ${{ github.workspace }}/.pnpm-store

jobs:
  build:
    name: Build the studio
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read # read the site's base path without deployment authority
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup-toolchain
        with:
          install-dependencies: 'true'
          # CI's build-test job is the one writer for the shared cache key.
          save-nix-store: 'false'

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # A project Pages site lives below /<repository>/. Passing configure-pages'
      # answer to Vite keeps asset URLs valid there; an account site has an
      # empty base path and therefore receives `/`.
      - name: Build the studio for its Pages path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: >-
          nix develop .#ci --command
          pnpm nx build @saerskriven/studio --base="${PAGES_BASE_PATH}/"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/studio/dist

  # Keep the write token away from the dependency tree and build. This job
  # receives only the opaque Pages artifact prepared above.
  deploy:
    name: Deploy the studio
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: none
      pages: write # publish the Pages deployment
      id-token: write # OIDC identity the Pages deployment is signed against
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
