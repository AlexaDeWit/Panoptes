name: Cache cleanup

# Keep the Actions cache under the repository quota. setup-toolchain keys the Nix store
# on the flake pair, so every flake change mints a 1.4 GB entry and ci.yml's main-only
# save rule cannot reach the epoch it supersedes. This is the reaper for what that rule
# leaves behind: off-main stragglers, superseded epochs, and keys no workflow writes.
# scripts/prune-caches.sh owns the retention rules and the allow-list.
#
# A plain `push` on the dependency-plan files, not `workflow_run` or
# pull_request_target, keeps the privileged `actions: write` token in this
# single-purpose workflow. Nothing outside this workflow reaps an off-main entry:
# ci.yml saves only on main and deletes nothing.

on:
  push:
    branches: [main]
    paths:
      - flake.lock
      - flake.nix
      - pnpm-lock.yaml
  schedule:
    # Off the hour, where GitHub's scheduled-run backlog is deepest.
    - cron: '42 3 * * *'
  workflow_dispatch:

concurrency:
  group: cache-cleanup
  cancel-in-progress: false

permissions: {}

jobs:
  prune:
    name: Prune Actions cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout, to run scripts/prune-caches.sh
      actions: write # delete caches via the REST API
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      KEEP_PER_PREFIX: '2' # newest N per key prefix to retain on main
      KEEP_NIX: '1' # a `nix-*` epoch is 1.4 GB, so that prefix retains the current one alone
      # One DELETE per cache, so an unbounded backlog would outrun both the job timeout
      # and GitHub's secondary limit of 500 mutations an hour, which the step fails on
      # rather than mistaking for an already-deleted entry. The daily run drains the rest.
      MAX_DELETES: '400'
      # The usage API reports the size, not the quota, so the ceiling is stated here.
      # The owner raised it from GitHub's 10 GB default on 2026-09-12.
      CACHE_QUOTA_GIB: '15'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prune superseded, off-main, and unwritten caches
        run: |
          set -euo pipefail

          # No `|| true` on the listing: --paginate streams pages as they arrive, so a
          # failed page would otherwise leave a partial file that is non-empty and
          # reads as the whole cache.
          gh api --paginate "repos/$REPO/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id, .ref, .key, .created_at, .size_in_bytes] | @tsv' \
            > caches.tsv

          if [ ! -s caches.tsv ]; then
            echo "No caches found; nothing to prune."
            exit 0
          fi

          # The script refuses a listing whose rows are not five fields with a numeric
          # id and size, so a stream cut mid-row stops here rather than reaching the
          # DELETE loop. Its stdout is the id list, most urgent first, and its stderr
          # reasons about each id in the same order.
          if ! bash scripts/prune-caches.sh < caches.tsv \
            > all-to-delete.txt 2> all-reasons.txt; then
            cat all-reasons.txt >&2
            exit 1
          fi
          head -n "$MAX_DELETES" all-to-delete.txt > to-delete.txt

          total=$(wc -l < all-to-delete.txt | tr -d ' ')
          count=$(wc -l < to-delete.txt | tr -d ' ')
          # Truncated to the head this run deletes, so the log claims no more than it reaps.
          head -n "$count" all-reasons.txt
          echo "Caches selected: $total, deleting this run: $count"
          if [ "$count" -eq 0 ]; then
            echo "Cache already within retention policy."
            exit 0
          fi

          # A DELETE that is not 204 or 404 is a token without actions: write, a
          # throttled run, or an outage. Reporting those as "already gone" would keep
          # the job green while the cache kept growing.
          while read -r id; do
            [ -n "$id" ] || continue
            headers=$(gh api -X DELETE --include --silent \
              "repos/$REPO/actions/caches/$id" 2>/dev/null) || true
            status=$(printf '%s\n' "$headers" | awk 'NR == 1 { print $2 }')
            case "$status" in
              204) echo "deleted $id" ;;
              404) echo "$id already gone" ;;
              *) echo "DELETE $id: HTTP ${status:-no response}" >&2; exit 1 ;;
            esac
          done < to-delete.txt

          if [ "$total" -gt "$count" ]; then
            echo "$((total - count)) selected caches remain for the next run."
          fi

      - name: Report remaining usage
        if: ${{ always() }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/cache/usage" \
            --jq '[.active_caches_count, .active_caches_size_in_bytes] | @tsv' \
            | awk -F'\t' -v quota="$CACHE_QUOTA_GIB" \
              '{ printf "Active caches: %s, %.2f GiB of the %s GiB quota\n", $1, $2 / 1073741824, quota }' \
            >> "$GITHUB_STEP_SUMMARY"
