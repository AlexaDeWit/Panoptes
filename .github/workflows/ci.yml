name: CI

# Push-to-main and pull_request, so a feature-branch push never double-runs
# beside its PR. A v* tag runs the same workflow: a release is what this
# pipeline produces when the ref is a tag, not a second pipeline that would
# drift from this one (docs/release.md).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Never cancel on main or on a tag: main keeps the complete build history of
# every commit that lands, and a cancelled tag run would leave a release
# half made.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/main'
    && !startsWith(github.ref, 'refs/tags/v') }}

# Least privilege by default. Jobs that need more widen it at the job level.
permissions:
  contents: read

env:
  # One deterministic pnpm store location, shared with the cache in
  # .github/actions/setup-toolchain.
  npm_config_store_dir: ${{ github.workspace }}/.pnpm-store
  # Deno packages the CLI and is told to reach for nothing: no update check,
  # and no prompt that could hang a run waiting for an answer.
  DENO_NO_UPDATE_CHECK: '1'
  DENO_NO_PROMPT: '1'

jobs:
  build-test:
    name: Build, typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC for tokenless Codecov upload (no stored token)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain

      # cache-nix-action trims the store with `nix store gc` before saving, and
      # a dev shell holds no GC root, so without this profile the saved entry
      # loses `.#ci`.
      - name: Root the .#ci shell for the Nix-store cache save
        run: nix develop .#ci --profile "$RUNNER_TEMP/panoptes-ci-profile" --command true

      - name: Install dependencies
        run: nix develop .#ci --command pnpm install --frozen-lockfile

      # The same command a contributor runs locally, so local and CI cannot
      # drift. The script (package.json) chains sync check, lint, boundaries,
      # format check, build, typecheck, and test with coverage; the coverage
      # output feeds the Codecov upload below.
      - name: Check
        run: nix develop .#ci --command pnpm check

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true # tokenless upload via GitHub OIDC, no CODECOV_TOKEN secret
          fail_ci_if_error: true # a lost upload must not silently skip the gate

      # GitHub's ubuntu-latest image is Ubuntu 24.04, which ships
      # kernel.apparmor_restrict_unprivileged_userns=1 and so denies the
      # unprivileged `unshare -rn` that scripts/package-cli.sh compiles
      # inside. Lift it here rather than let a compile reach the network:
      # the script refuses to run at all where the namespace cannot be made,
      # so a runner that keeps the restriction fails the compile instead of
      # quietly fetching a runtime nobody pinned. A no-op where the knob does
      # not exist.
      - name: Allow the unprivileged user namespace the compile runs in
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "no apparmor_restrict_unprivileged_userns on this runner"
          fi

      # Check above built the CLI bundle; this compiles it with deno twice,
      # in a network namespace with no route out, fails unless the two agree
      # byte for byte, and runs the executable. A change the packaged build
      # cannot carry therefore fails on the pull request that makes it,
      # rather than once a tag is pushed and the ruleset forbids moving it.
      #
      # The host target alone off a tag, so the common run stays short. The
      # tag run compiles the whole matrix, and those are the executables the
      # release carries.
      - name: Compile the CLI and run it
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: nix develop .#ci --command scripts/package-cli.sh

      # The step above only runs --version, one validate and one PDF render.
      # This runs the CLI's whole scenario table through the executable it
      # just compiled, which the Check step could not: dist/cli does not
      # exist yet then, and nx does not hash it, so the run has to skip the
      # cache. The environment variable makes a missing executable fail the
      # suite rather than drop a runner in silence.
      - name: Run the CLI tests against the compiled executable
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: nix develop .#ci --command env PANOPTES_COMPILED_RUNNER=required pnpm nx test @panoptes/cli --skip-nx-cache

      - name: Compile every target and run the host one
        if: startsWith(github.ref, 'refs/tags/v')
        run: nix develop .#ci --command scripts/package-cli.sh --all

      # The executables are named after the version in the manifests, so an
      # executable that answers with the tag's version proves the tag, the
      # manifests and the binary agree. A tag cut on the wrong commit fails
      # here, before anything is published. The executable is standalone, so
      # this step needs nothing from the flake.
      - name: Check the Linux executable against the tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          reported="$("./dist/cli/panoptes-${version}-x86_64-unknown-linux-gnu" --version)"
          if [ "$reported" != "$version" ]; then
            echo "the executable reports ${reported}, the tag names ${version}" >&2
            exit 1
          fi

      - name: Hand the executables to the attest and publish jobs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-executables
          path: dist/cli/
          if-no-files-found: error
          retention-days: 7

      # Restore-everywhere, save-on-main-only, one writer: the same policy as
      # the Nix store, applied to the pnpm store.
      - name: Save pnpm store (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('flake.lock', 'pnpm-lock.yaml') }}

  # Workflow linting (actionlint for syntax and semantics, zizmor for the
  # security rules the repository already commits to: SHA pins, injection-free
  # run blocks; policy in .github/zizmor.yml) and SAST over the source tree
  # (semgrep, findings uploaded to code scanning).
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          # build-test is the one writer for the shared "nix" prefix.
          save-nix-store: 'false'

      - name: Lint workflows (actionlint)
        run: nix develop .#ci --command actionlint

      # --config is explicit so a moved or undiscovered policy file fails
      # loudly instead of silently reverting to zizmor's defaults.
      - name: Audit workflows (zizmor)
        run: >-
          nix develop .#ci --command
          zizmor --offline --config .github/zizmor.yml .github/

      # --config auto fetches registry rules over the network at scan time
      # (accepted in #70). --error exits non-zero on any finding at ERROR or
      # WARNING severity, which fails this job and with it the gate. Per-rule
      # exclusions go here as --exclude-rule, each with its reason beside it.
      - name: Scan sources (semgrep)
        run: >-
          nix develop .#ci --command
          semgrep scan --config auto --severity ERROR --severity WARNING
          --sarif-output=semgrep.sarif --error .

      # The Security tab is the triage view; the gating is the --error exit
      # above. if: always() so findings still reach code scanning when the
      # scan step fails the job.
      - name: Upload semgrep SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # Browser-level smoke: the app boots under a real browser from the flake's
  # pinned browsers (no network download; PLAYWRIGHT_BROWSERS_PATH points into
  # the nix store). Its own job so browser time never stretches build-test.
  e2e-smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          # build-test is the one writer for the shared "nix" prefix.
          save-nix-store: 'false'

      - name: Install dependencies
        run: nix develop .#ci --command pnpm install --frozen-lockfile

      - name: Run the smoke suite
        run: nix develop .#ci --command pnpm nx e2e @panoptes/studio-e2e

  # Whether this run touches the files that decide the dependency tree. The
  # provenance job below reaches the npm registry, so it runs when one of
  # them moved and is skipped otherwise, and the gate accepts that skip only
  # with this job's answer beside it.
  dependency-changes:
    name: Dependency file changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lockfile: ${{ steps.diff.outputs.lockfile }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD and its parents. A pull request is checked out as its merge
          # commit, whose first parent is the branch it targets; a push
          # carries the commit before it.
          fetch-depth: 2

      # A checkout with one commit in it (a repository's first) has nothing
      # to compare against, so the answer there is that they changed.
      - name: Compare the dependency files against the base commit
        id: diff
        run: |
          changed=true
          if [ "$(git rev-list --count HEAD)" -gt 1 ]; then
            moved="$(git diff --name-only HEAD^ HEAD -- \
              pnpm-lock.yaml pnpm-workspace.yaml)"
            if [ -z "$moved" ]; then
              changed=false
            fi
          fi
          echo "lockfile=$changed" >>"$GITHUB_OUTPUT"
          echo "pnpm-lock.yaml or pnpm-workspace.yaml changed: $changed"

  # The npm provenance attestation of every package in the catalog, verified
  # against the sigstore trust root and compared with what the same package
  # attested on the base commit, with the packages that publish no
  # attestation reported as the residual (scripts/check-provenance.mjs).
  # A move this project accepts is declared on the commit that makes it, as
  # a `Provenance-Move:` trailer, which the script reads out of the commits
  # between the base and here.
  #
  # It runs when the lockfile or the catalog moved, which is where a Renovate
  # bump appears, and unconditionally on a push and a dispatch;
  # docs/release.md names it as a step before a tag.
  #
  # Its own job because it reaches the registry: a registry out of reach reds
  # this job alone, which the verdict below names. The script attempts each
  # audit twice before reporting that it could not run. The install is for
  # the `yaml` package the script parses both lockfiles with, and carries
  # --ignore-scripts, so no install-time script in the tree runs here. One
  # package still runs code: `yaml` itself, which the script imports and
  # which sits in the residual this job prints, so the parser is inside the
  # audit it performs. Threat 25 records that.
  provenance:
    name: Dependency provenance
    needs: dependency-changes
    if: >-
      github.event_name != 'pull_request'
      || needs.dependency-changes.outputs.lockfile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base commit is the baseline the check compares against.
          fetch-depth: 2

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          # build-test is the one writer for the shared "nix" prefix.
          save-nix-store: 'false'

      - name: Install the lockfile parser
        run: >-
          nix develop .#ci --command
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Check dependency provenance
        run: nix develop .#ci --command scripts/check-provenance.mjs

  gate:
    name: CI gate
    # The single required check. Wire a new gating job in by adding it to
    # `needs` AND to the verdict step, so a job that silently never ran can
    # never read as green.
    needs:
      [build-test, static-checks, e2e-smoke, dependency-changes, provenance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gating job
        env:
          BUILD_TEST: ${{ needs.build-test.result }}
          STATIC_CHECKS: ${{ needs.static-checks.result }}
          E2E_SMOKE: ${{ needs.e2e-smoke.result }}
          DEPENDENCY_CHANGES: ${{ needs.dependency-changes.result }}
          LOCKFILE_CHANGED: ${{ needs.dependency-changes.outputs.lockfile }}
          PROVENANCE: ${{ needs.provenance.result }}
        run: |
          verdict=0
          if [ "$BUILD_TEST" = "success" ]; then
            echo "ok      build-test"
          else
            echo "FAILED  build-test: $BUILD_TEST"
            verdict=1
          fi
          if [ "$STATIC_CHECKS" = "success" ]; then
            echo "ok      static-checks"
          else
            echo "FAILED  static-checks: $STATIC_CHECKS"
            verdict=1
          fi
          if [ "$E2E_SMOKE" = "success" ]; then
            echo "ok      e2e-smoke"
          else
            echo "FAILED  e2e-smoke: $E2E_SMOKE"
            verdict=1
          fi
          if [ "$DEPENDENCY_CHANGES" = "success" ]; then
            echo "ok      dependency-changes"
          else
            echo "FAILED  dependency-changes: $DEPENDENCY_CHANGES"
            verdict=1
          fi
          # The provenance job is skipped where no dependency file moved.
          # That skip, and no other, reads as green.
          if [ "$PROVENANCE" = "success" ]; then
            echo "ok      provenance"
          elif [ "$PROVENANCE" = "skipped" ] \
            && [ "$DEPENDENCY_CHANGES" = "success" ] \
            && [ "$LOCKFILE_CHANGED" = "false" ]; then
            echo "ok      provenance: skipped, no dependency file changed"
          else
            echo "FAILED  provenance: $PROVENANCE"
            verdict=1
          fi
          exit "$verdict"

  # A provenance attestation over every file the release will carry, so
  # anyone can check an asset was built by this workflow, on this repository,
  # at this commit: `gh attestation verify <asset> --repo AlexaDeWit/Panoptes`
  # (issue #114, and the README's install section).
  #
  # The event is tested as well as the ref: this workflow accepts
  # workflow_dispatch, and a dispatch aimed at an existing tag would otherwise
  # re-drive attest and publish with no push behind them.
  #
  # Its own job, rather than a step in build-test, so `attestations: write`
  # exists on tag runs alone instead of on every pull request. The predicate
  # names the workflow run and the commit rather than the job, so attesting
  # the artifact here says exactly what attesting it where it was compiled
  # would; the cost is downloading it twice, once here and once to publish.
  attest:
    name: Attest the executables
    needs: gate
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC identity the attestation is signed against
      attestations: write # write the attestation to this repository
    steps:
      - name: Take the executables from build-test
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-executables
          path: cli

      - name: Attest every asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            cli/panoptes-*
            cli/SHA256SUMS

  # A release, made only when the gate above is green on a v* tag and every
  # asset is attested. It hangs off the gate rather than joining it: the
  # gate's `needs` and verdict are the required check and stay as they are,
  # and publishing is a consequence of a green gate, not a condition of one.
  # Nothing is installed or compiled here, so the write permission never sits
  # beside a dependency tree.
  #
  # The `release` environment admits v* tags and nothing else, so a run on any
  # other ref cannot reach it even if the condition above were edited wrong.
  # Its rules are repository settings rather than workflow config, and
  # docs/release.md, "What the rules guarantee, and what they cannot", records
  # what they are and how to check them.
  publish:
    name: Publish the release
    needs: [gate, attest]
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # create or update the release and its assets
    steps:
      # For CHANGELOG.md alone.
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Take the executables from build-test
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-executables
          path: cli

      # The section CHANGELOG.md carries for this version, which nx release
      # wrote before the version landed on main. nx renders a major release
      # as an H1 and everything else as an H2, so a heading is either, and
      # the next heading of either level ends the section. The version is
      # compared as a field rather than matched as a regex: a dot would
      # otherwise match any character, and awk implementations disagree over
      # backslashes passed through -v.
      #
      # A tag whose version has no section falls back to GitHub's generated
      # notes rather than failing: the ruleset forbids deleting or moving a
      # tag, so a release that stopped here could not be retried from a
      # corrected one. This step and the next use the runner's own awk and
      # gh, which the flake does not carry and which no build depends on.
      - name: Take the changelog section for this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          : >release-notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v version="$version" '
              /^#?# / {
                if (inside) exit
                if ($2 == version) { inside = 1; print }
                next
              }
              inside { print }
            ' CHANGELOG.md >release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "no CHANGELOG.md section for ${version}" >&2
          fi

      # Idempotent: re-running this workflow on a tag that already carries a
      # release replaces the assets instead of failing. A tag cannot be moved
      # or deleted, so a re-run is the only recovery there is.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber cli/panoptes-* cli/SHA256SUMS
          else
            notes=(--generate-notes)
            if [ -s release-notes.md ]; then
              notes=(--notes-file release-notes.md)
            fi
            gh release create "$TAG" --title "$TAG" --verify-tag \
              "${notes[@]}" cli/panoptes-* cli/SHA256SUMS
          fi
