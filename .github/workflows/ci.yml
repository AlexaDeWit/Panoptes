name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: 'Retry Latest website deployment without rebuilding or publishing'
        type: boolean
        default: false

# A cancelled tag run can leave a release partly published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.deploy_pages || false }}
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/main'
    && !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

env:
  npm_config_store_dir: ${{ github.workspace }}/.pnpm-store
  DENO_NO_UPDATE_CHECK: '1'
  DENO_NO_PROMPT: '1'

jobs:
  build-test:
    if: ${{ !inputs.deploy_pages }}
    name: Build, typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC for tokenless Codecov upload (no stored token)
    env:
      # Where the step below writes the module. Every step after it that
      # builds or compiles the CLI reads this, because the CLI build copies
      # the module into dist/assets and refuses without it.
      SAERSKRIVEN_RESVG_WASM: ${{ github.workspace }}/result/lib/saerskriven_resvg.wasm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-dependencies: 'true'

      - name: Check the installed Nix CLI without runtime network access
        run: nix build --no-link --print-build-logs --option sandbox true .#checks.x86_64-linux.saerskriven

      # Built here rather than taken from the rasterizer job, which saves no
      # Nix-store entry: this job is the one that writes the shared `nix`
      # prefix on main, so the module lands in the store it already saves and
      # a later run finds the output path valid and skips the Rust build.
      # What the entry has to carry for that is the 2 MiB output alone, which
      # `./result` roots. The 2.7 GiB of Rust build inputs are rooted by
      # nothing, so the `nix store gc` before the save collects them and the
      # 5G ceiling holds: the rooted closure measures 3.45 GiB for the `.#ci`
      # shell plus 2 MiB for the module.
      # sandbox true gives the builder no network, as in the rasterizer job.
      - name: Build the rasterizer module the CLI carries
        run: nix build --print-build-logs --option sandbox true .#resvg-wasm

      - name: Check
        run: nix develop .#ci --command pnpm check

      - name: Upload coverage to Codecov
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        timeout-minutes: 2
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true # tokenless upload via GitHub OIDC, no CODECOV_TOKEN secret
          fail_ci_if_error: true # Report upload failures even when the step is advisory.

      # Ubuntu AppArmor blocks the network namespace used by the offline compiler.
      - name: Allow the unprivileged user namespace the compile runs in
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "no apparmor_restrict_unprivileged_userns on this runner"
          fi

      - name: Compile the CLI and run it
        run: nix develop .#ci --command pnpm nx compile @saerskriven/cli

      - name: Run the CLI tests against the compiled executable
        run: nix develop .#ci --command pnpm nx test-compiled @saerskriven/cli

      # test-compiled restores the host-only output. Compile the full matrix afterwards.
      - name: Compile every target and run the host one
        run: nix develop .#ci --command pnpm nx compile @saerskriven/cli --configuration=all

      - name: Package the installer for this release
        run: nix develop .#ci --command bash scripts/release/package-installer.sh

      - name: Check the executable version and all checksums
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          version="$(jq -r .version package.json)"
          expected="${TAG:-v$version}"
          reported="$("./dist/cli/saer-${version}-x86_64-unknown-linux-gnu" --version)"
          if [ "v$reported" != "$expected" ]; then
            echo "the executable reports ${reported}, expected ${expected}" >&2
            exit 1
          fi
          (cd dist/cli && sha256sum --check SHA256SUMS)

      - name: Hand the executables to the attest and publish jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-executables
          path: dist/cli/
          if-no-files-found: error
          retention-days: 7

      - name: Save pnpm store (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('flake.lock', 'pnpm-lock.yaml') }}

  installer-smoke:
    if: ${{ !inputs.deploy_pages }}
    name: Installer smoke (${{ matrix.os }})
    needs: build-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the packaged CLI and installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-executables
          path: cli
      - name: Install and upgrade with the system shell and tools
        run: /bin/bash scripts/release/install-smoke.sh

  rasterizer:
    if: ${{ !inputs.deploy_pages }}
    name: Rasterizer module
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC for tokenless Codecov upload (no stored token)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-dependencies: 'true'
          # Restore the shared entry, save nothing: the Rust closure is 2.7G
          # where the entries every other job restores from already hold 8.2G
          # of the repository's 10G limit, and saving it would evict them.
          # Only the Rust half of this job's store is then cold, which is a
          # build of about a minute on a job nothing waits for.
          save-nix-store: 'false'

      # sandbox true gives the builder no network: a crate the vendored
      # registry does not hold fails here rather than being fetched.
      - name: Build the rasterizer module offline
        run: nix build --print-build-logs --option sandbox true .#resvg-wasm

      # The rasterizer's spec skips where the variable is unset, so the run is
      # gated on the module being there, rather than on a green suite that may
      # have skipped. An unset key, an empty value and a path naming no file
      # all fail here.
      - name: Rasterize a fixture through the module
        env:
          SAERSKRIVEN_RESVG_WASM: ${{ github.workspace }}/result/lib/saerskriven_resvg.wasm
        run: |
          nix develop .#ci --command test -f "$SAERSKRIVEN_RESVG_WASM"
          nix develop .#ci --command pnpm nx test @saerskriven/render -- --coverage.enabled=true

      - name: Upload coverage to Codecov
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        timeout-minutes: 2
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true # tokenless upload via GitHub OIDC, no CODECOV_TOKEN secret
          fail_ci_if_error: true # Report upload failures even when the step is advisory.

  static-checks:
    if: ${{ !inputs.deploy_pages }}
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          save-nix-store: 'false'

      - name: Lint workflows (actionlint)
        run: nix develop .#ci --command actionlint

      - name: Audit workflows (zizmor)
        run: >-
          nix develop .#ci --command
          zizmor --offline --config .github/zizmor.yml .github/

      # Registry rules are fetched at scan time, as accepted in #70.
      - name: Scan sources (semgrep)
        run: >-
          nix develop .#ci --command
          semgrep scan --config auto --severity ERROR --severity WARNING
          --sarif-output=semgrep.sarif --error .

      - name: Upload semgrep SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  e2e-smoke:
    if: ${{ !inputs.deploy_pages }}
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The studio build refuses without it, because the PNG export reads it,
      # so both the development server and the Pages preview need it here.
      SAERSKRIVEN_RESVG_WASM: ${{ github.workspace }}/result/lib/saerskriven_resvg.wasm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-dependencies: 'true'
          save-nix-store: 'false'

      # The restored store already holds the output on any run after the
      # first, so this validates the path rather than rebuilding the crate.
      # sandbox true gives the builder no network, as in the rasterizer job.
      - name: Build the rasterizer module the studio carries
        run: nix build --print-build-logs --option sandbox true .#resvg-wasm

      - name: Run the smoke suite
        run: nix develop .#ci --command pnpm nx e2e @saerskriven/studio-e2e

  dependency-changes:
    if: ${{ !inputs.deploy_pages }}
    name: Dependency file changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lockfile: ${{ steps.diff.outputs.lockfile }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The PR merge ref has the base branch as its first parent.
          fetch-depth: 2

      - name: Compare the dependency files against the base commit
        id: diff
        run: |
          changed=true
          if [ "$(git rev-list --count HEAD)" -gt 1 ]; then
            moved="$(git diff --name-only HEAD^ HEAD -- \
              pnpm-lock.yaml pnpm-workspace.yaml)"
            if [ -z "$moved" ]; then
              changed=false
            fi
          fi
          echo "lockfile=$changed" >>"$GITHUB_OUTPUT"
          echo "pnpm-lock.yaml or pnpm-workspace.yaml changed: $changed"

  provenance:
    name: Dependency provenance
    needs: dependency-changes
    if: >-
      !inputs.deploy_pages
      && (github.event_name != 'pull_request'
      || needs.dependency-changes.outputs.lockfile == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Provenance-Move trailers can occur anywhere in the branch history.
          fetch-depth: 0

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          save-nix-store: 'false'

      - name: Install the lockfile parser
        run: >-
          nix develop .#ci --command
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Check dependency provenance
        run: nix develop .#ci --command scripts/check-provenance.mjs

  checks:
    name: Source checks
    # Fork and Dependabot PRs cannot request signing permissions.
    outputs:
      attestation: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs:
      [
        build-test,
        installer-smoke,
        static-checks,
        e2e-smoke,
        dependency-changes,
        provenance,
      ]
    if: ${{ always() && !inputs.deploy_pages }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gating job
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_TEST: ${{ needs.build-test.result }}
          INSTALLER_SMOKE: ${{ needs.installer-smoke.result }}
          STATIC_CHECKS: ${{ needs.static-checks.result }}
          E2E_SMOKE: ${{ needs.e2e-smoke.result }}
          DEPENDENCY_CHANGES: ${{ needs.dependency-changes.result }}
          LOCKFILE_CHANGED: ${{ needs.dependency-changes.outputs.lockfile }}
          PROVENANCE: ${{ needs.provenance.result }}
        run: |
          verdict=0
          if [ "$BUILD_TEST" = "success" ]; then
            echo "ok      build-test"
          else
            echo "FAILED  build-test: $BUILD_TEST"
            verdict=1
          fi
          if [ "$STATIC_CHECKS" = "success" ]; then
            echo "ok      static-checks"
          else
            echo "FAILED  static-checks: $STATIC_CHECKS"
            verdict=1
          fi
          if [ "$INSTALLER_SMOKE" = "success" ]; then
            echo "ok      installer-smoke"
          else
            echo "FAILED  installer-smoke: $INSTALLER_SMOKE"
            verdict=1
          fi
          if [ "$E2E_SMOKE" = "success" ]; then
            echo "ok      e2e-smoke"
          else
            echo "FAILED  e2e-smoke: $E2E_SMOKE"
            verdict=1
          fi
          if [ "$DEPENDENCY_CHANGES" = "success" ]; then
            echo "ok      dependency-changes"
          else
            echo "FAILED  dependency-changes: $DEPENDENCY_CHANGES"
            verdict=1
          fi
          if [ "$PROVENANCE" = "success" ]; then
            echo "ok      provenance"
          elif [ "$PROVENANCE" = "skipped" ] \
            && [ "$EVENT_NAME" = "pull_request" ] \
            && [ "$DEPENDENCY_CHANGES" = "success" ] \
            && [ "$LOCKFILE_CHANGED" = "false" ]; then
            echo "ok      provenance: skipped, no dependency file changed"
          else
            echo "FAILED  provenance: $PROVENANCE"
            verdict=1
          fi
          exit "$verdict"

  pages-build:
    name: Build the release website
    needs: checks
    # Override skip propagation from the optional provenance ancestor.
    if: >-
      !cancelled() && !inputs.deploy_pages && needs.checks.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup-toolchain
        with:
          install-dependencies: 'true'
          save-nix-store: 'false'
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The website carries the module as a hashed asset, so its build reads
      # the same variable the CLI build does. sandbox true gives the builder
      # no network, as in the rasterizer job.
      - name: Build the rasterizer module the website carries
        run: nix build --print-build-logs --option sandbox true .#resvg-wasm
      - name: Build and package the website
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_SITE_URL: ${{ steps.pages.outputs.base_url }}
          SAERSKRIVEN_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          SAERSKRIVEN_RESVG_WASM: ${{ github.workspace }}/result/lib/saerskriven_resvg.wasm
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$SAERSKRIVEN_RELEASE_TAG" ]; then
            SAERSKRIVEN_RELEASE_TAG="v$(jq -r .version package.json)"
            export SAERSKRIVEN_RELEASE_TAG
          fi
          nix develop .#ci --command pnpm nx build @saerskriven/studio
          nix develop .#ci --command bash scripts/release/pages.sh prepare
      - name: Store the release website
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-site
          path: release-site/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest the release assets
    needs: [checks, pages-build]
    if: >-
      !cancelled() && !inputs.deploy_pages
      && needs.checks.result == 'success' && needs.pages-build.result == 'success'
      && needs.checks.outputs.attestation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC identity the attestation is signed against
      attestations: write # write the attestation to this repository
    steps:
      - name: Take the executables from build-test
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-executables
          path: cli

      - name: Take the website from pages-build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-site
          path: release-site

      - name: Attest every asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            cli/saer-*
            cli/SHA256SUMS
            cli/install.sh
            release-site/studio.tar
            release-site/studio-release.json

      - name: Verify every asset against this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for asset in cli/saer-* cli/SHA256SUMS cli/install.sh release-site/studio.tar release-site/studio-release.json; do
            gh attestation verify "$asset" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/ci.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          done

  gate:
    name: ${{ inputs.deploy_pages && 'Deployment retry (no CI gate)' || 'CI gate' }}
    needs: [checks, pages-build, attest]
    if: ${{ always() && !inputs.deploy_pages }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the release rehearsal
        env:
          CHECKS: ${{ needs.checks.result }}
          PAGES_BUILD: ${{ needs.pages-build.result }}
          ATTEST: ${{ needs.attest.result }}
          ATTESTATION_REQUIRED: ${{ needs.checks.outputs.attestation }}
        run: |
          if [ "$CHECKS" != success ] || [ "$PAGES_BUILD" != success ]; then
            echo "FAILED source checks: $CHECKS, website build: $PAGES_BUILD" >&2
            exit 1
          fi
          case "$ATTESTATION_REQUIRED:$ATTEST" in
            true:success) echo 'Release artifacts built and attestations verified.' ;;
            false:skipped) echo 'Release artifacts built. Fork and Dependabot tokens cannot sign attestations.' ;;
            *) echo "FAILED attestation: $ATTEST (required: $ATTESTATION_REQUIRED)" >&2; exit 1 ;;
          esac

  publish:
    name: Publish the release
    needs: [gate, attest, pages-build]
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # create or update the release and its assets
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Take the executables from build-test
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-executables
          path: cli

      - name: Take the prepared website
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-site
          path: release-site

      # Nx uses H1 or H2 release headings. Missing notes use GitHub-generated text.
      - name: Take the changelog section for this version
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          : >release-notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v version="$version" '
              /^#?# / {
                if (inside) exit
                if ($2 == version) { inside = 1; print }
                next
              }
              inside { print }
            ' CHANGELOG.md >release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            gh api "repos/$GH_REPO/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body >release-notes.md
          fi
          printf '\n' >>release-notes.md
          sed -e "s|@RELEASE_TAG@|$TAG|g" -e "s|@REPOSITORY@|$GH_REPO|g" \
            scripts/release/install-notes.md >>release-notes.md

      # A retry replaces assets on the existing release without moving its tag.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber cli/saer-* cli/SHA256SUMS cli/install.sh release-site/studio.tar release-site/studio-release.json
            gh release edit "$TAG" --notes-file release-notes.md
          else
            notes=(--notes-file release-notes.md)
            if [[ "$TAG" == *-* ]]; then
              notes+=(--prerelease)
            fi
            gh release create "$TAG" --title "$TAG" --verify-tag \
              "${notes[@]}" cli/saer-* cli/SHA256SUMS cli/install.sh release-site/studio.tar release-site/studio-release.json
          fi

  pages-prepare:
    name: Verify the latest release website
    needs: publish
    if: >-
      !cancelled()
      && ((github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
      && !contains(github.ref_name, '-')
      && needs.publish.result == 'success')
      || (github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && inputs.deploy_pages))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      eligible: ${{ steps.release.outputs.eligible }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Checkout the promotion controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve Latest and verify its archive
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: bash scripts/release/pages.sh resolve
      # Preserve the verified archive bytes through promotion.
      - name: Stage the Pages artifact
        if: steps.release.outputs.eligible == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: release-site/artifact.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  pages-deploy:
    name: Deploy the latest release
    needs: pages-prepare
    if: ${{ !cancelled() && needs.pages-prepare.result == 'success' && needs.pages-prepare.outputs.eligible == 'true' }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout the promotion controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recheck Latest after any environment wait
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_TAG: ${{ needs.pages-prepare.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.pages-prepare.outputs.commit }}
        run: bash scripts/release/pages.sh check
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Check the version served to a fresh request
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_TAG: ${{ needs.pages-prepare.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/release/pages.sh verify-live
