name: Set up toolchain
description: >-
  Install the flake-pinned Nix, restore the Nix store, and restore the pnpm
  store, with an optional frozen dependency install. One home for the
  SHA-pinned setup actions and the cache config, so Renovate bumps each pin
  once.

  Caching policy, following Écluse: restore everywhere, save only on main, one
  writer per key. A PR restores main's entries through GitHub's base-branch
  fallback and never saves. Nothing here reaps the entry a new key supersedes,
  so .github/workflows/cache-cleanup.yml does.

inputs:
  install-dependencies:
    description: >-
      Whether to install the workspace dependencies from the frozen lockfile.
      Jobs needing a deliberately different install keep that step themselves.
    default: 'false'
  save-nix-store:
    description: >-
      Whether this job may save the Nix-store cache (only ever on main). Set
      "false" for a job that restores a prefix another job writes, so the two
      never race for the one entry.
    default: 'true'
  nix-cache-prefix:
    description: >-
      The Nix-store cache key prefix, one entry per distinct closure. "nix" is
      the shared `.#ci` dev-shell store. A job that realises a different
      closure needs its own prefix and must be its sole writer. A prefix
      outside `nix-*` also needs an allow-list entry in
      scripts/prune-caches.sh, which reaps a key no workflow writes.
    default: 'nix'
  nix-gc-max-store-size:
    description: >-
      The size cache-nix-action trims the Nix store to before saving. The trim
      is a `nix store gc`, so root what the entry must carry: the job roots the
      .#ci shell profile before saving, and the out-link the `resvg-wasm` nx
      project writes roots the rasterizer module
      (nix/resvg-wasm/project.json).
    default: '5G'

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      with:
        # Determinate Nix logs the runner in to FlakeHub, which adds
        # substituters no run is authorised for. auto-optimise-store's hard
        # links break the cache restore (nix-community/cache-nix-action#170).
        determinate: false
        extra-conf: |
          connect-timeout = 10
          download-attempts = 5
          auto-optimise-store = false

    # Keyed on the flake. Two conditions gate the save, main and the
    # save-nix-store input, so exactly one job writes each prefix.
    - name: Cache Nix store
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: ${{ inputs.nix-cache-prefix }}-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: ${{ inputs.nix-cache-prefix }}-${{ runner.os }}-
        save: ${{ inputs.save-nix-store == 'true' && github.ref == 'refs/heads/main' }}
        gc-max-store-size-linux: ${{ inputs.nix-gc-max-store-size }}

    # The workflow sets npm_config_store_dir to this path, so pnpm installs
    # from it. Saved by the workflow on main only, mirroring the Nix rule.
    - name: Restore pnpm store
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.pnpm-store
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('flake.lock', 'pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    # cache-nix-action trims with `nix store gc` before saving. A dev shell is
    # not a GC root by itself, so retain the closure the main-only save needs.
    - name: Root the .#ci shell for the Nix-store cache save
      if: inputs.save-nix-store == 'true' && github.ref == 'refs/heads/main'
      shell: bash
      run: nix develop .#ci --profile "$RUNNER_TEMP/saerskriven-ci-profile" --command true

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: nix develop .#ci --command pnpm install --frozen-lockfile
